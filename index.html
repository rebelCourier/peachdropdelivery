<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="styles/indexstyle.css">
  <link rel="stylesheet" type="text/css" href="styles/reset.css">
  <link rel="icon" type="image/x-icon" href="baseassets/peachlogo.svg">
  <title>PeachDrop</title>
</head>
<body>
  <nav>
    <img class="title-logo" src="baseassets/peachtitlelogo.svg" alt="title logo">
    <ul class="nav-links">
      <li class="option"><a href="#">About</a></li>
      <li class="option"><a href="#">Order</a></li>
      <li class="option"><a href="#">Couriers</a></li>
      <li class="option"><a href="#">Map</a></li>
      <li class="option"><a href="#">Account</a></li>
    </ul>
  </nav>
  <main id="home">
    <section class="hero">
      <video autoplay muted loop id="background-video">
      <source src="baseassets/backgroundvideo.mp4" type="video/mp4">
      </video>
      <div class="hero-landing">
        <p>
          <span>Order Local,</span><br>
          <span>Delivered By Bike</span>
        </p>
        <button><a href="#">Order Now</a></button>
      </div>
    </section>
    <section class="courier-list">
      <h1>| Meet Your Couriers</h1>
      <div class="profiles">
        <span class="profile1">Swiper</span>
        <span class="profile2">Nick</span>
        <span class="profile3">Tae</span>
        <span class="profile4">Life</span>
        <span class="profile5">Frogi</span>
        <span class="profile6">DJ</span>
      </div>
    </section>
  </main>
  <footer>
    <img class="footer-logo" src="baseassets/peachtitlelogo.svg" alt="small logo">
  </footer>
</body>
</html>
